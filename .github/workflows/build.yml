name: Build AudioStripper

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required repository files
        run: |
          $requiredFiles = @(
            'build/Ensure-Ffmpeg.ps1',
            'build/Test-Package.ps1',
            'build/FFmpeg-COPYING.GPLv3.txt',
            'build/FFmpeg-NOTICE.txt',
            'config.json',
            'audiostripper.ico'
          )
          $missingFiles = @($requiredFiles | Where-Object { !(Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingFiles.Count -gt 0) {
            throw "Required files are missing from the checkout: $($missingFiles -join ', '). Commit and push the entire build directory, config.json, and icon. Use 'git add -f build/' if build scripts were ignored."
          }

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Restore FFmpeg download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: obj/ffmpeg
          key: ffmpeg-windows-x64-${{ hashFiles('build/Ensure-Ffmpeg.ps1') }}

      - name: Restore dependencies
        run: dotnet restore AudioStripper.csproj --runtime win-x64

      - name: Publish application using installed .NET
        run: dotnet publish AudioStripper.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output artifacts/AudioStripper-win-x64-framework-dependent

      - name: Verify package and MP3 conversion
        run: ./build/Test-Package.ps1 -OutputDirectory ./artifacts/AudioStripper-win-x64-framework-dependent

      - name: Create download ZIP
        run: Compress-Archive -Path ./artifacts/AudioStripper-win-x64-framework-dependent/* -DestinationPath ./artifacts/AudioStripper-win-x64.zip -CompressionLevel Optimal

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AudioStripper-win-x64-${{ github.run_number }}
          path: artifacts/AudioStripper-win-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: AudioStripper-win-x64-${{ github.run_number }}
          path: release

      - name: Create release and attach ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = './release/AudioStripper-win-x64.zip'
          if (!(Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw 'The tested release ZIP is missing.'
          }
          gh release view "$env:RELEASE_TAG" --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $asset --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $asset --verify-tag --title "AudioStripper $env:RELEASE_TAG" --generate-notes --notes 'Requires the .NET 9 Windows Desktop Runtime (x64). Extract the entire ZIP and run AudioStripper.exe. FFmpeg is included; the .NET runtime is not bundled.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release creation or asset upload failed.'
          }

